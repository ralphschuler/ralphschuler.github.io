name: Sync GitHub Pages projects

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: pages-project-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update project catalog and blog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      should_publish: ${{ steps.publish.outputs.should_publish }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test project sync
        run: npm test

      - name: Sync successful Pages deployments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync-projects

      - name: Commit generated content
        id: commit
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pages-project-state.json source/_data/projects.json source/projects source/_posts/project-updates source-en/_data/projects.json source-en/projects source-en/_posts/project-updates
          git commit -m "chore: sync GitHub Pages projects"
          git push origin HEAD:main

          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether the site needs publishing
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          CONTENT_CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [[ "$CONTENT_CHANGED" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deployments_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&sha=${COMMIT_SHA}&per_page=10"
          if ! deployments="$(curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$deployments_url")"; then
            echo "Could not inspect previous deployments; publishing as a safe fallback."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for deployment_id in $(jq -r '.[].id' <<< "$deployments"); do
            statuses_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20"
            if ! statuses="$(curl --fail --silent --show-error --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$statuses_url")"; then
              continue
            fi
            if jq -e 'any(.state == "success")' <<< "$statuses" > /dev/null; then
              echo "The current commit is already published successfully."
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No successful deployment exists for the current commit; publishing."
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish synchronized site
    needs: sync
    if: needs.sync.outputs.should_publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-pages.yml
    with:
      ref: ${{ needs.sync.outputs.commit_sha }}
