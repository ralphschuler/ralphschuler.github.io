name: Build static site and deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git reference to deploy
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Exact Git reference to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUILD_DIR: "public"

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: |
          yarn install --frozen-lockfile

      - name: Build
        run: |
          yarn build

      - name: Assert build dir exists
        run: test -d "${{ env.BUILD_DIR }}"

      - name: Add .nojekyll
        run: touch "${{ env.BUILD_DIR }}/.nojekyll"

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "${{ env.BUILD_DIR }}"

  deploy:
    name: Deploy static site to gh-pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
